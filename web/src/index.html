<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitSrv</title>
<script>
  (function () {
    try {
      var saved = localStorage.getItem('gitsrv_theme');
      if (saved === 'dark' || saved === 'light') document.documentElement.setAttribute('data-theme', saved);
    } catch (e) { /* system default */ }
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/css/gs-tokens.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="app-header">
  <a class="brand" href="#/"><span class="glyph" aria-hidden="true"></span> GitSrv</a>
  <nav id="nav" class="app-nav"></nav>
  <span class="spacer"></span>
  <div id="user-menu" class="user-menu"></div>
  <button id="theme-toggle" type="button" aria-label="Toggle theme">Theme</button>
</header>

<main id="view" aria-live="polite"></main>

<script type="module" src="/js/app.js"></script>
</body>
</html>
