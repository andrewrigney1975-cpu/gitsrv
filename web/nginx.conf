# Plain HTTP only. A TLS-terminating proxy must sit in front of this before any real deployment
# (see docker-compose.yml). The api container publishes no host port; this nginx is the only route
# to it, so X-Forwarded-* set here is trusted downstream.
server {
  listen 80;
  root /usr/share/nginx/html;

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  # script-src keeps 'unsafe-inline' for the one small pre-paint theme bootstrap inline in
  # index.html; everything else is an external module. Tightening this to a hash is a fine follow-up.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  location = /health {
    proxy_pass http://api:8080/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $request_id;
  }

  location /api/ {
    proxy_pass http://api:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $request_id;
    proxy_http_version 1.1;
  }

  location /css/ { try_files $uri =404; }
  location /js/  { try_files $uri =404; }

  location / {
    try_files $uri /index.html;
  }
}
